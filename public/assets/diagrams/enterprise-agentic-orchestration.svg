<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" width="960" height="676" role="img" aria-labelledby="title-ent desc-ent">
  <title id="title-ent">Enterprise Agentic AI &amp; LLM Orchestration — Architecture</title>
  <desc id="desc-ent">Customer multi-turn inquiries enter a stateful LangGraph and LangChain workflow coordinating specialized support nodes with dynamic memory, hybrid vector search, structured tool calling, and LLM inference optimization, resolving routine inquiries or escalating complex cases to human agents.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="676" fill="#FAFBFD" rx="8" />

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#0F172A">Enterprise Agentic AI — Stateful LangGraph Multi-Agent Support Architecture</text>

  <!-- Step 1: Customer Inquiry -->
  <rect x="280" y="54" width="400" height="48" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3" />
  <text x="480" y="83" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#1E293B">Customer Multi-Turn Support Inquiry</text>

  <line x1="480" y1="102" x2="480" y2="160" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Layer 2: Stateful Orchestration Layer -->
  <rect x="48" y="132" width="864" height="176" rx="10" fill="#F4F5F7" stroke="#E2E8F0" stroke-width="1.2" />
  <text x="68" y="152" text-anchor="start" class="sans" font-size="12" font-weight="600" fill="#475569">01. Stateful Orchestration (LangGraph &amp; LangChain)</text>

  <!-- LangGraph Orchestrator -->
  <rect x="290" y="166" width="380" height="60" rx="10" fill="#E8F2FC" stroke="#93C5FD" stroke-width="1.5" />
  <text x="480" y="192" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#0F4C81">LangGraph Stateful Reasoning Graph</text>
  <text x="480" y="211" text-anchor="middle" class="sans" font-size="11" fill="#3B6EA5">Deterministic state transitions &amp; intent routing</text>

  <!-- Dynamic Memory -->
  <rect x="70" y="242" width="240" height="52" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.3" />
  <text x="190" y="265" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#312E81">Dynamic Memory</text>
  <text x="190" y="282" text-anchor="middle" class="sans" font-size="11" fill="#4338CA">Multi-turn verified context</text>

  <!-- Specialized Support Nodes -->
  <rect x="350" y="242" width="260" height="52" rx="10" fill="#E8F2FC" stroke="#93C5FD" stroke-width="1.3" />
  <text x="480" y="265" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#0F4C81">Specialized Agent Nodes</text>
  <text x="480" y="282" text-anchor="middle" class="sans" font-size="11" fill="#3B6EA5">LangChain task coordination</text>

  <!-- Inference Optimization -->
  <rect x="650" y="242" width="240" height="52" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.3" />
  <text x="770" y="265" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#312E81">LLM Inference Tuning</text>
  <text x="770" y="282" text-anchor="middle" class="sans" font-size="11" fill="#4338CA">Optimized production execution</text>

  <!-- Connections inside Layer 2 -->
  <path d="M 290 196 L 190 196 L 190 236" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="480" y1="226" x2="480" y2="237" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)" />
  <path d="M 670 196 L 770 196 L 770 236" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Arrows Layer 2 -> Layer 3 -->
  <path d="M 415 294 L 415 322 L 270 322 L 270 362" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)" />
  <path d="M 545 294 L 545 322 L 690 322 L 690 362" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Layer 3: Grounding & Backend Execution -->
  <rect x="48" y="336" width="864" height="122" rx="10" fill="#F4F5F7" stroke="#E2E8F0" stroke-width="1.2" />
  <text x="68" y="356" text-anchor="start" class="sans" font-size="12" font-weight="600" fill="#475569">02. Knowledge Grounding &amp; Action Execution</text>

  <rect x="92" y="368" width="356" height="72" rx="10" fill="#E8F2FC" stroke="#93C5FD" stroke-width="1.4" />
  <text x="270" y="396" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#0F4C81">Hybrid Vector Search</text>
  <text x="270" y="415" text-anchor="middle" class="sans" font-size="11" fill="#3B6EA5">Retrieves authoritative policy &amp; product context</text>
  <text x="270" y="430" text-anchor="middle" class="sans" font-size="11" fill="#3B6EA5">from enterprise vector databases</text>

  <rect x="512" y="368" width="356" height="72" rx="10" fill="#E8F2FC" stroke="#93C5FD" stroke-width="1.4" />
  <text x="690" y="396" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#0F4C81">Structured Tool Calling</text>
  <text x="690" y="415" text-anchor="middle" class="sans" font-size="11" fill="#3B6EA5">Fetches live account state &amp; executes</text>
  <text x="690" y="430" text-anchor="middle" class="sans" font-size="11" fill="#3B6EA5">verified backend support actions</text>

  <!-- Arrows Layer 3 -> Resolution Gate -->
  <path d="M 270 440 L 270 476 L 420 476 L 420 494" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)" />
  <path d="M 690 440 L 690 476 L 540 476 L 540 494" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Resolution Gate -->
  <rect x="290" y="500" width="380" height="44" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3" />
  <text x="480" y="527" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#1E293B">Resolution &amp; Complexity Gate</text>

  <!-- Split to Outcomes -->
  <path d="M 390 544 L 390 566 L 256 566 L 256 584" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
  <path d="M 570 544 L 570 566 L 704 566 L 704 584" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Outcome Left: Autonomous Resolution -->
  <rect x="64" y="590" width="384" height="68" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.4" />
  <text x="256" y="619" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#065F46">Autonomous Resolution</text>
  <text x="256" y="639" text-anchor="middle" class="mono" font-size="11" fill="#047857">&gt;60% Reduction in Human Escalations</text>

  <!-- Outcome Right: Human Escalation -->
  <rect x="512" y="590" width="384" height="68" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.4" />
  <text x="704" y="619" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#92400E">Targeted Human Escalation</text>
  <text x="704" y="639" text-anchor="middle" class="sans" font-size="11" fill="#B45309">Clean handoff with context only when warranted</text>
</svg>
